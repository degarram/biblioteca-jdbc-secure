<!DOCTYPE html>
<html lang="es" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Autores')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="titulo-seccion">✍️ Autores</h2>
        <a class="btn btn-success" sec:authorize="hasAnyRole('ADMIN', 'BIBLIOTECARIO')" th:href="@{/autores/nuevo}">
            <i class="bi bi-plus-lg"></i> Añadir autor
        </a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <table class="table table-bordered table-hover bg-white align-middle">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th class="col-accion" sec:authorize="hasAnyRole('ADMIN', 'BIBLIOTECARIO')">Editar</th>
            <th class="col-accion" sec:authorize="hasRole('ADMIN')">Borrar</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(autores)}">
            <td class="text-center text-muted" colspan="3">No hay autores</td>
        </tr>
        <tr th:each="a : ${autores}">
            <td th:text="${a.nombre}">Nombre</td>
            <td sec:authorize="hasAnyRole('ADMIN', 'BIBLIOTECARIO')">
                <a class="btn btn-warning btn-sm"
                   th:href="@{/autores/editar/{id}(id=${a.id})}" title="Editar">
                    <i class="bi bi-pencil"></i>
                </a>
            </td>
            <td sec:authorize="hasRole('ADMIN')">
                <form method="post" onsubmit="return confirm('Se borrarán también todos sus libros. ¿Continuar?');"
                      th:action="@{/autores/borrar/{id}(id=${a.id})}">
                    <button class="btn btn-danger btn-sm" title="Borrar" type="submit">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
