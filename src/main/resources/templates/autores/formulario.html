<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Autor')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container" style="max-width: 640px;">

    <h2 class="titulo-seccion mb-4"
        th:text="${autorDto.id == null} ? 'Nuevo autor' : 'Editar autor'">
        Autor
    </h2>

    <form class="card card-body shadow-sm" method="post" novalidate
          th:action="@{/autores/guardar}" th:object="${autorDto}">

        <!-- El id viaja oculto: vacío en alta, relleno en edición -->
        <input th:field="*{id}" type="hidden">

        <div class="mb-4">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" th:field="*{nombre}"
                   type="text">
            <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Guardar</button>
            <a class="btn btn-outline-secondary" th:href="@{/autores}">Cancelar</a>
        </div>
    </form>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
