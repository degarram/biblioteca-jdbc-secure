<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div class="row g-2 align-items-start mt-1" th:fragment="camposFiltro">
    <div class="col-md-4">
        <label class="form-label" for="titulo">Título</label>
        <input class="form-control" th:field="*{titulo}" type="text">
    </div>
    <div class="col-md-2">
        <label class="form-label" for="limite">Mostrar</label>
        <input class="form-control" inputmode="numeric" th:classappend="${#fields.hasErrors('limite')} ? 'is-invalid'" th:field="*{limite}"
               type="text">
        <div class="invalid-feedback" th:errors="*{limite}">Error</div>
    </div>
    <div class="col-md-3">
        <label class="form-label" for="orden">Ordenar por</label>
        <select class="form-select" th:field="*{orden}">
            <option value="fecha">Fecha</option>
            <option value="titulo">Título</option>
        </select>
    </div>
    <div class="col-md-3 d-flex align-items-center" style="padding-top: 2rem;">
        <div class="form-check">
            <input class="form-check-input" th:field="*{soloClasicos}" type="checkbox">
            <label class="form-check-label" th:for="${#ids.prev('soloClasicos')}">
                Solo clásicos
            </label>
        </div>
    </div>
</div>

</body>
</html>
