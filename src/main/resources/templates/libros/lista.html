<!DOCTYPE html>
<html lang="es" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Libros')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="titulo-seccion">📚 Libros</h2>
        <a class="btn btn-success" sec:authorize="hasAnyRole('ADMIN', 'BIBLIOTECARIO')" th:href="@{/libros/nuevo}">
            <i class="bi bi-plus-lg"></i> Añadir libro
        </a>
    </div>

    <div th:replace="~{fragments/layout :: alertas}"></div>

    <!-- Por GET: los filtros quedan en la URL y se conservan tras buscar -->
    <form class="card card-body shadow-sm mb-3" method="get" novalidate
          th:action="@{/libros}" th:object="${filtro}">
        <div class="row g-2 align-items-start">
            <div class="col-md-4">
                <label class="form-label" for="autorId">Autor</label>
                <select class="form-select" th:classappend="${#fields.hasErrors('autorId')} ? 'is-invalid'"
                        th:field="*{autorId}">
                    <option value="">Todos los autores</option>
                    <option th:each="a : ${autores}"
                            th:text="${a.nombre}"
                            th:value="${a.id}">Autor
                    </option>
                </select>
                <div class="invalid-feedback" th:errors="*{autorId}">Error</div>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="anioDesde">Desde</label>
                <input class="form-control" inputmode="numeric" th:classappend="${#fields.hasErrors('anioDesde')} ? 'is-invalid'" th:field="*{anioDesde}"
                       type="text">
                <div class="invalid-feedback" th:errors="*{anioDesde}">Error</div>
            </div>
            <div class="col-md-2">
                <label class="form-label" for="anioHasta">Hasta</label>
                <input class="form-control" inputmode="numeric" th:classappend="${#fields.hasErrors('anioHasta')} ? 'is-invalid'" th:field="*{anioHasta}"
                       type="text">
                <div class="invalid-feedback" th:errors="*{anioHasta}">Error</div>
            </div>
            <div class="col-md-4 d-flex gap-2 text-nowrap" style="padding-top: 2rem;">
                <button class="btn btn-primary" type="submit">
                    <i class="bi bi-funnel"></i> Filtrar
                </button>
                <a class="btn btn-outline-secondary" th:href="@{/libros}">Limpiar</a>
            </div>
        </div>
    </form>

    <!-- Si hay errores en el filtro, "libros" no está en el modelo -->
    <th:block th:if="${libros != null}">

        <p class="alert alert-info" th:if="${#lists.isEmpty(libros)}">
            No hay libros con esos filtros
        </p>

        <th:block th:unless="${#lists.isEmpty(libros)}">
            <p class="text-muted" th:text="|${#lists.size(libros)} libros encontrados|">0 libros</p>

            <table class="table table-bordered table-hover bg-white align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ISBN</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Publicación</th>
                    <th class="col-accion" sec:authorize="hasAnyRole('ADMIN', 'BIBLIOTECARIO')">Editar</th>
                    <th class="col-accion" sec:authorize="hasRole('ADMIN')">Borrar</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="l : ${libros}">
                    <td th:text="${l.isbn}">ISBN</td>
                    <td th:text="${l.titulo}">Título</td>
                    <td th:text="${l.autorNombre}">Autor</td>
                    <td th:text="${#temporals.format(l.fechaPublicacion, 'dd/MM/yyyy')}">01/01/2000</td>
                    <td sec:authorize="hasAnyRole('ADMIN', 'BIBLIOTECARIO')">
                        <a class="btn btn-warning btn-sm"
                           th:href="@{/libros/editar/{isbn}(isbn=${l.isbn})}" title="Editar">
                            <i class="bi bi-pencil"></i>
                        </a>
                    </td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <form method="post" onsubmit="return confirm('¿Seguro que quieres borrar este libro?');"
                              th:action="@{/libros/borrar/{isbn}(isbn=${l.isbn})}">
                            <button class="btn btn-danger btn-sm" title="Borrar" type="submit">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </th:block>
    </th:block>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
